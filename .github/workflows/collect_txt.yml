name: Collect TXT Files

on:
  schedule:
    - cron: '0 0 * * *' # Запуск каждый день в полночь (UTC)
  workflow_dispatch: # Позволяет запускать вручную кнопкой в интерфейсе GitHub

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Чеккаут своего репозитория
        uses: actions/checkout@v4

      - name: Скачивание файлов
        run: |
          # Используем raw-ссылки на файлы из чужих профилей/репозиториев
          curl -sSL "https://raw.githubusercontent.com/user1/repo1/main/file1.txt" -o file1.txt
          curl -sSL "https://raw.githubusercontent.com/user2/repo2/master/file2.txt" -o file2.txt

          # Если нужно объединить их в один общий файл:
          # cat file1.txt file2.txt > summary.txt

      - name: Коммит и пуш обновлений
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git diff --staged --quiet || (git commit -m "Auto-update txt files [skip ci]" && git push)
