name: Collect TXT Files

on:
  schedule:
    - cron: '12,42 * * * *' # Каждые 30 минут (на 12 и 42 минутах)
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Чеккаут своего репозитория
        uses: actions/checkout@v4

      - name: Создание папки и скачивание файлов
        run: |
          # Создаем папку sub (если ее еще нет)
          mkdir -p sub

          # Скачиваем файлы напрямую в эту папку
          curl -sSL "https://raw.githubusercontent.com/kudryash0vv/kudryash0vv.YKTFLOW/refs/heads/main/configs/mobile_ykt.%231.txt" -o sub/1.txt
          curl -sSL "https://raw.githubusercontent.com/kudryash0vv/kudryash0vv.YKTFLOW/refs/heads/main/configs/mobile_ykt.%232.txt" -o sub/2.txt

          # Если нужно объединить их в один общий файл внутри этой же папки:
          cat sub/1.txt sub/2.txt > sub/all.txt

      - name: Коммит и пуш обновлений
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git diff --staged --quiet || (git commit -m "Auto-update txt files [skip ci]" && git push)
