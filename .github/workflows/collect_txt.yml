name: Collect TXT Files

on:
  schedule:
    - cron: '20 */4 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Чеккаут своего репозитория
        uses: actions/checkout@v4

      - name: Скачивание, дедупликация и сортировка по протоколам (по 50 000 строк)
        env:
          URLS: |
            ${{ secrets.SOURCE_URLS_1 }}
            ${{ secrets.SOURCE_URLS_2 }}
            ${{ secrets.SOURCE_URLS_3 }}
        run: |
          mkdir -p sub
          rm -f sub/*.txt
          
          # 1. Скачиваем данные со всех источников
          > temp_raw.txt
          echo "$URLS" | while IFS= read -r url; do
            # Безопасная очистка URL от пробелов и \r без использования xargs
            clean_url=$(echo "$url" | tr -d '\r' | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//')
            if [ -n "$clean_url" ]; then
              curl -sSLf -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64)" "$clean_url" >> temp_raw.txt || true
              echo "" >> temp_raw.txt
            fi
          done

          # 2. Очищаем от дубликатов по части ДО знака #
          awk -F'#' '
            {
              gsub(/\r/, "")
              gsub(/^[ \t]+|[ \t]+$/, "")
            }
            $0 != "" && !seen[$1]++
          ' temp_raw.txt > temp_clean.txt

          echo "Всего уникальных строк (ALL): $(wc -l < temp_clean.txt)"

          # Функция для разбиения файла на части по 50 000 строк и переименования в target, target2...
          split_and_rename() {
            local input_file="$1"
            local prefix="$2"
            
            if [ -s "$input_file" ]; then
              split -l 50000 -d --additional-suffix=.txt "$input_file" "sub/part_${prefix}_"
              
              local count=1
              for f in sub/part_${prefix}_*.txt; do
                if [ -f "$f" ]; then
                  if [ $count -eq 1 ]; then
                    mv "$f" "sub/${prefix}.txt"
                  else
                    mv "$f" "sub/${prefix}${count}.txt"
                  fi
                  count=$((count+1))
                fi
              done
            fi
          }

          # 3. Фильтруем протоколы из единого очищенного файла temp_clean.txt ДО его разбиения
          grep -i 'vless://' temp_clean.txt > temp_vless.txt || true
          grep -i 'vmess://' temp_clean.txt > temp_vmess.txt || true
          grep -iE '(ss://|shadowsocks://)' temp_clean.txt > temp_ss.txt || true
          grep -i 'ssr://' temp_clean.txt > temp_ssr.txt || true
          grep -i 'trojan://' temp_clean.txt > temp_trojan.txt || true
          grep -iE '(hysteria2://|hy2://)' temp_clean.txt > temp_hy2.txt || true
          grep -i 'tuic://' temp_clean.txt > temp_tuic.txt || true
          grep -iE '(socks5://|socks://)' temp_clean.txt > temp_socks.txt || true
          grep -iE '(wireguard://|wg://)' temp_clean.txt > temp_wg.txt || true

          # Выводим статистику в лог Actions
          echo "VLESS: $(wc -l < temp_vless.txt)"
          echo "VMESS: $(wc -l < temp_vmess.txt)"
          echo "SS: $(wc -l < temp_ss.txt)"
          echo "TROJAN: $(wc -l < temp_trojan.txt)"
          echo "HY2: $(wc -l < temp_hy2.txt)"

          # 4. Разбиваем общий файл (all) по 50 000 строк
          split_and_rename "temp_clean.txt" "all"

          # 5. Разбиваем файлы протоколов по 50 000 строк
          split_and_rename "temp_vless.txt" "vless"
          split_and_rename "temp_vmess.txt" "vmess"
          split_and_rename "temp_ss.txt" "ss"
          split_and_rename "temp_ssr.txt" "ssr"
          split_and_rename "temp_trojan.txt" "trojan"
          split_and_rename "temp_hy2.txt" "hy2"
          split_and_rename "temp_tuic.txt" "tuic"
          split_and_rename "temp_socks.txt" "socks"
          split_and_rename "temp_wg.txt" "wg"

          # 6. Удаляем временные файлы
          rm -f temp_*.txt

      - name: Принудительный коммит и пуш
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add -A sub/
          git commit --allow-empty -m "Auto-update deduplicated txt files [skip ci]"
          git pull --rebase origin main
          git push
