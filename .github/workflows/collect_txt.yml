name: Collect TXT Files

on:
  schedule:
    - cron: '12,42 * * * *'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Чеккаут своего репозитория
        uses: actions/checkout@v4

      - name: Создание папки и скачивание файлов
        run: |
          mkdir -p sub
          curl -sSL "https://raw.githubusercontent.com/kudryash0vv/kudryash0vv.YKTFLOW/main/configs/mobile_ykt.%231.txt" -o sub/1.txt
          curl -sSL "https://raw.githubusercontent.com/kudryash0vv/kudryash0vv.YKTFLOW/main/configs/mobile_ykt.%232.txt" -o sub/2.txt
          cat sub/1.txt sub/2.txt > sub/all.txt

      - name: Коммит и пуш обновлений
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add sub/
          git diff --staged --quiet || (git commit -m "Auto-update txt files [skip ci]" && git push)
